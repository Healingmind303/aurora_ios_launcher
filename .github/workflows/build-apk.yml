name: Build Aurora APK
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Fix unsupported Bluetooth settings constant
        shell: bash
        run: |
          FILE="app/src/main/java/com/aurora/ioslauncher/LauncherActivity.java"
          if [ ! -f "$FILE" ]; then
            echo "ERROR: Expected source file not found: $FILE"
            echo "Current directory: $PWD"
            find app/src/main/java -name 'LauncherActivity.java' -print || true
            exit 1
          fi
          sed -i 's/Settings\.Panel\.ACTION_BLUETOOTH/Settings.ACTION_BLUETOOTH_SETTINGS/g' "$FILE"
          echo "Bluetooth settings references after patch:"
          grep -n 'ACTION_BLUETOOTH' "$FILE" || true
          if grep -q 'Settings.Panel.ACTION_BLUETOOTH' "$FILE"; then
            echo "ERROR: Unsupported Bluetooth constant is still present."
            exit 1
          fi
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-iOS-Launcher-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
